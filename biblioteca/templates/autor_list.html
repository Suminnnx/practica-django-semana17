{% extends 'base.html' %}

{% block contenido %}
<h1>Lista de autores</h1>
<a href="{% url 'autor_create' %}" class="boton">Nuevo autor</a>
<br><br>

<table>
    <thead>
        <tr>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Nacionalidad</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for autor in autores %}
        <tr>
            <td>{{ autor.nombre }}</td>
            <td>{{ autor.apellido }}</td>
            <td>{{ autor.nacionalidad }}</td>
            <td>
                <a href="{% url 'autor_update' autor.id %}">Editar</a>
                <a href="{% url 'autor_delete' autor.id %}">Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
