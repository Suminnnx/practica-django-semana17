{% extends 'base.html' %}

{% block contenido %}
<h1>Lista de libros</h1>
<a href="{% url 'libro_create' %}" class="boton">Nuevo libro</a>
<br><br>

<table>
    <thead>
        <tr>
            <th>Título</th>
            <th>Género</th>
            <th>Año</th>
            <th>Autor</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for libro in libros %}
        <tr>
            <td>{{ libro.titulo }}</td>
            <td>{{ libro.genero }}</td>
            <td>{{ libro.anio_publicacion }}</td>
            <td>{{ libro.autor }}</td>
            <td>
                <a href="{% url 'libro_update' libro.id %}">Editar</a>
                <a href="{% url 'libro_delete' libro.id %}">Eliminar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
